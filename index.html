<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأكاديمية الدولية للإبداع | International Creative Academy - ICA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0a;
            --dark-bg: #151515;
            --text-color: #ffffff;
            --gold-color: #d4af37;
            --accent-color: #2d5a27;
            --secondary-gold: #b8860b;
            --section-bg: rgba(255, 255, 255, 0.02);
            --border-color: rgba(212, 175, 55, 0.1);
            --font-primary: 'Cairo', sans-serif;
            --font-arabic: 'Amiri', serif;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-primary);
            direction: rtl;
        }

        body.loaded {
            overflow: auto;
        }

        /* ===== ANIMATION STYLES ===== */
        /* حاوية أنيميشن الصورة */
        .logo-animation-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            z-index: 9998;
            pointer-events: none;
            opacity: 0;
            overflow: hidden;
        }
        
        .logo-animation-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        /* خلفية متدرجة للأنيميشن */
        .animation-gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                var(--gold-color) 0%, 
                var(--secondary-gold) 25%, 
                var(--accent-color) 50%, 
                #151515 100%);
            opacity: 0;
            z-index: 1;
        }
        
        /* حاوية الصورة مع تأثير الماسك */
        .logo-image-mask {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            z-index: 3;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.5);
        }
        
        /* الصورة الرئيسية */
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(1.2) contrast(1.1);
            transform: scale(1.1);
        }
        
        /* ماسك SVG */
        .logo-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
        }
        
        .mask-shape {
            fill: white;
        }
        
        /* الخطوط المتحركة */
        .animation-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        .line {
            position: absolute;
            background: var(--gold-color);
            transform-origin: center;
            opacity: 0;
        }
        
        /* جزيئات متحركة */
        .animation-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: var(--gold-color);
            border-radius: 50%;
            opacity: 0;
        }
        
        /* النص المضيء */
        .glowing-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-arabic);
            font-size: 72px;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(90deg, 
                var(--gold-color), 
                var(--secondary-gold), 
                #ffffff, 
                var(--gold-color));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            z-index: 5;
            opacity: 0;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
            white-space: nowrap;
        }
        
        .glowing-text-subtitle {
            position: absolute;
            top: calc(50% + 50px);
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-primary);
            font-size: 24px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            z-index: 5;
            opacity: 0;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* إطارات ذهبية */
        .golden-frame {
            position: absolute;
            border: 2px solid transparent;
            border-radius: 20px;
            z-index: 4;
            opacity: 0;
        }
        
        .frame-1 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 450px;
            border-image: linear-gradient(45deg, var(--gold-color), transparent, var(--secondary-gold), transparent) 1;
        }
        
        .frame-2 {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 500px;
            border-image: linear-gradient(135deg, transparent, var(--gold-color), transparent, var(--secondary-gold)) 1;
        }
        
        /* تأثيرات الضوء */
        .light-beam {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, 
                rgba(212, 175, 55, 0.2) 0%, 
                rgba(212, 175, 55, 0.1) 30%, 
                transparent 70%);
            z-index: 0;
            opacity: 0;
            top: -50%;
            left: -50%;
        }
        
        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s var(--transition-smooth);
        }

        .loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            font-family: var(--font-arabic);
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            margin-bottom: 20px;
        }

        .loading-logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
            transform: scaleX(0);
            transform-origin: right;
            animation: loadingLine 2s var(--transition-smooth) infinite;
        }

        @keyframes loadingLine {
            0% {
                transform: scaleX(0);
                transform-origin: right;
            }

            50% {
                transform: scaleX(1);
                transform-origin: right;
            }

            51% {
                transform-origin: left;
            }

            100% {
                transform: scaleX(0);
                transform-origin: left;
            }
        }
        
        .loading-progress {
            width: 200px;
            height: 2px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 1px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .loading-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold-color), var(--secondary-gold));
            border-radius: 1px;
            transition: width 0.3s ease;
        }

        /* Side Navigation Buttons */
        .side-nav-buttons {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 998;
            opacity: 0;
            transition: opacity 0.8s var(--transition-smooth);
        }

        .side-nav-buttons.visible {
            opacity: 1;
        }

        .side-nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--border-color);
            color: var(--gold-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.4s var(--transition-smooth);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform: rotateZ(270deg);
        }

        .side-nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .side-nav-btn:hover::before {
            opacity: 0.2;
        }

        .side-nav-btn:hover {
            transform: translateX(-5px) scale(1.1);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            border-color: var(--gold-color);
        }

        .side-nav-btn:active {
            transform: translateX(-2px) scale(1.05);
        }

        .side-nav-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .side-nav-btn.disabled:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--border-color);
        }

        .side-nav-btn.disabled::before {
            display: none;
        }

        /* Navigation Labels */
        .nav-label {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 10, 10, 0.9);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--gold-color);
            white-space: nowrap;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .side-nav-btn:hover .nav-label {
            opacity: 1;
            transform: translateY(-50%) translateX(-5px);
        }

        /* Side Navigation for RTL */
        .side-nav-buttons.rtl {
            right: auto;
        }

        .side-nav-buttons.rtl .side-nav-btn:hover {
            transform: translateX(5px) scale(1.1);
        }

        .side-nav-buttons.rtl .nav-label {
            right: auto;
            left: 60px;
        }

        .side-nav-buttons.rtl .side-nav-btn:hover .nav-label {
            transform: translateY(-50%) translateX(5px);
        }

        /* Titles Navigation - مع أنيميشنات GSAP */
        .titles-container {
            position: fixed;
            left: 100px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
        }

        .titles-container.visible {
            opacity: 1;
            pointer-events: all;
        }

        .titles-container.hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .title-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.4s var(--transition-smooth);
            transform: translateX(-30px);
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .title-item::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .title-item:hover::before {
            opacity: 0.1;
        }

        .title-item.active {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--gold-color);
            transform: translateX(0);
            opacity: 1;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        .title-item:hover:not(.active) {
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(-5px);
            opacity: 0.9;
        }

        .title-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--gold-color);
            min-width: 25px;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            z-index: 2;
        }

        .title-item.active .title-number {
            transform: scale(1.2);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .title-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            transition: all 0.4s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
            position: relative;
            z-index: 2;
        }

        .title-item.active .title-text {
            color: var(--gold-color);
            font-weight: 600;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .title-connector {
            width: 1px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, var(--gold-color), transparent);
            margin: 2px 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .title-item.active+.title-connector,
        .title-item:hover+.title-connector {
            opacity: 0.5;
        }

        /* تأثير الذبذبة للعنصر النشط */
        .title-item.active {
            animation: pulseTitle 3s ease-in-out infinite;
        }

        @keyframes pulseTitle {
            0%, 100% {
                box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
            }
            50% {
                box-shadow: 0 5px 25px rgba(212, 175, 55, 0.4);
            }
        }

        /* Title Toggle Button */
        .title-toggle-btn {
            position: fixed;
            left: 100px;
            top: 23%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            color: var(--gold-color);
            font-size: 14px;
            transition: all 0.4s var(--transition-smooth);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
        }

        .title-toggle-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .title-toggle-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        /* Titles for RTL */
        .titles-container.rtl {
            left: auto;
            right: 30px;
            direction: rtl;
        }

        .titles-container.rtl .title-item {
            transform: translateX(30px);
        }

        .titles-container.rtl .title-item:hover:not(.active) {
            transform: translateX(5px);
        }

        .title-toggle-btn.rtl {
            left: auto;
            right: 10px;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            transform: translateY(-100%);
            transition: transform 0.8s var(--transition-smooth);
        }

        nav.visible {
            transform: translateY(0);
        }

        .logo {
            font-family: var(--font-arabic);
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            overflow: hidden;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-color), transparent);
            transform: scaleX(0);
            transition: transform 0.6s var(--transition-smooth);
        }

        .logo:hover::after {
            transform: scaleX(1);
        }

        .logo span {
            font-size: 10px;
            display: block;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            opacity: 0;
            transform: scale(0);
            transition: transform 0.4s var(--transition-smooth), opacity 0.4s ease;
            z-index: -1;
            border-radius: 15px;
        }

        .nav-links a:hover::before {
            opacity: 0.1;
            transform: scale(1);
        }

        .nav-links a:hover {
            color: var(--gold-color);
        }

        .cta button {
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            color: var(--bg-color);
            border: none;
            padding: 8px 18px;
            border-radius: 15px;
            cursor: pointer;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s var(--transition-smooth);
            box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
        }

        .cta button::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--secondary-gold), var(--gold-color));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            border-radius: 15px;
        }

        .cta button:hover::after {
            opacity: 1;
        }

        .cta button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        /* Parallax Background */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
            background:
                radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(45, 90, 39, 0.1) 0%, transparent 50%);
        }

        /* Main Container */
        .main-container {
            position: relative;
            width: 100%;
            max-height: 100vh;
            padding-top: 25px;
            perspective: 2000px;
            overflow: hidden;
        }

        /* Slider Container */
        .slider-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .slider {
            position: relative;
            width: 75%;
            height: 80vh;
            transform-style: preserve-3d;
            transform-origin: center center;
        }

        /* Individual Slide */
        .slide {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform, opacity;
            display: flex;
            flex-direction: column;
            opacity: 0;
        }

        .slide.active {
            opacity: 1;
        }

        .slide-bg {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            filter: grayscale(100%) brightness(0.2);
            transition: transform 0.8s var(--transition-smooth);
        }

        .slide:hover .slide-bg {
            transform: scale(1.05);
        }

        /* Animated Border */
        .slide::before {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            background: linear-gradient(45deg, transparent, var(--gold-color), transparent);
            border-radius: 14px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .slide.active::before {
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: .2;
            }
        }

        /* Slide Content */
        .slide-content-container {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.8s var(--transition-smooth), opacity 0.8s ease;
        }

        .slide.active .slide-content-container {
            transform: translateY(0);
            opacity: 1;
        }

        /* Section Animations */
        .section {
            background: var(--section-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.4s var(--transition-smooth);
            transform-origin: center;
            position: relative;
        }

        .section:hover::before {
            transform: translateX(100%);
        }

        .section:hover {
            border-color: var(--border-color);
            background: rgba(212, 175, 55, 0.02);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .section-icon {
            width: 28px;
            height: 28px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-color);
            font-size: 14px;
            transition: all 0.4s var(--transition-smooth);
        }

        .section:hover .section-icon {
            transform: rotateY(360deg);
            background: rgba(212, 175, 55, 0.2);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gold-color);
            flex: 1;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 0;
            height: 1px;
            background: var(--gold-color);
            transition: width 0.6s var(--transition-smooth);
        }

        .section:hover .section-title::after {
            width: 100%;
        }

        .section-content {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            transition: color 0.4s ease;
        }

        .section:hover .section-content {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Section Types */
        .title-section {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(45, 90, 39, 0.05));
            border-color: var(--border-color);
            padding: 12px 15px;
        }

        .title-section .section-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slide-number {
            font-size: 11px;
            color: var(--gold-color);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.6s var(--transition-smooth) 0.2s;
        }

        .slide.active .slide-number {
            opacity: 1;
            transform: translateX(0);
        }

        .main-title {
            font-family: var(--font-arabic);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s var(--transition-smooth) 0.4s;
        }

        .slide.active .main-title {
            opacity: 1;
            transform: translateY(0);
        }

        .arabic-title {
            font-family: var(--font-arabic);
            font-size: 18px;
            color: var(--gold-color);
            line-height: 1.3;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s var(--transition-smooth) 0.6s;
        }

        .slide.active .arabic-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* Feature Items */
        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .feature-item {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.1);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.4s var(--transition-smooth);
            transform-origin: left;
        }

        .feature-item:hover {
            transform: translateY(-2px) scale(1.02);
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.1);
        }

        .feature-item i {
            color: var(--gold-color);
            font-size: 12px;
            min-width: 12px;
            transition: transform 0.4s var(--transition-smooth);
        }

        .feature-item:hover i {
            transform: scale(1.2);
        }

        /* Content Columns */
        .content-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .column {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.4s var(--transition-smooth);
        }

        .column:hover {
            transform: translateY(-3px);
            border-color: var(--border-color);
            background: rgba(212, 175, 55, 0.03);
        }

        .column h5 {
            color: var(--gold-color);
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .column ul {
            list-style: none;
            padding-right: 12px;
        }

        .column li {
            margin-bottom: 5px;
            position: relative;
            padding-right: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            transition: color 0.3s ease;
        }

        .column:hover li {
            color: rgba(255, 255, 255, 0.9);
        }

        .column li:before {
            content: "•";
            color: var(--gold-color);
            position: absolute;
            right: 0;
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .column:hover li:before {
            transform: scale(1.5);
        }

        /* Highlight Section */
        .highlight-section {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(45, 90, 39, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.15);
            padding: 12px;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                border-color: rgba(212, 175, 55, 0.15);
            }

            50% {
                border-color: rgba(212, 175, 55, 0.3);
            }
        }

        /* Form Styling */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--gold-color);
            font-weight: 600;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-family: var(--font-primary);
            font-size: 11px;
            transition: all 0.4s var(--transition-smooth);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold-color);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
            transform: translateY(-1px);
        }

        /* Slide Footer */
        .slide-footer {
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.8s var(--transition-smooth);
        }

        .slide.active .slide-footer {
            transform: translateY(0);
            opacity: 1;
        }

        .slide-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicator-dots {
            display: flex;
            gap: 5px;
        }

        .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.4s var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .indicator-dot::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: var(--gold-color);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.4s var(--transition-smooth);
        }

        .indicator-dot.active::before {
            transform: scale(1);
        }

        .slide-cta {
            display: flex;
            gap: 8px;
        }

        .slide-cta button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-family: var(--font-primary);
            font-size: 11px;
            transition: all 0.4s var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .slide-cta button::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold-color), var(--secondary-gold));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            border-radius: 15px;
        }

        .slide-cta .primary::before {
            opacity: 1;
        }

        .slide-cta .primary {
            background: transparent;
            border: 1px solid transparent;
            color: var(--bg-color);
            font-weight: 600;
        }

        .slide-cta button:hover::before {
            opacity: 1;
        }

        .slide-cta button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(100%);
            transition: transform 0.8s var(--transition-smooth);
        }

        footer.visible {
            transform: translateY(0);
        }

        .scroll-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gold-color);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .scroll-hint:hover {
            color: var(--secondary-gold);
        }

        .scroll-hint i {
            animation: bounce 2s infinite;
            font-size: 12px;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-3px);
            }

            60% {
                transform: translateY(-1px);
            }
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 2px;
            background: rgba(212, 175, 55, 0.1);
            z-index: 1001;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-color), var(--secondary-gold));
            width: 0%;
            transition: width 0.6s var(--transition-smooth);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: var(--gold-color);
            border-radius: 50%;
            opacity: 0.1;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .slider {
                width: 92%;
            }

            .main-title {
                font-size: 20px;
            }

            .arabic-title {
                font-size: 16px;
            }
            
            .logo-image-mask {
                width: 500px;
                height: 333px;
            }
            
            .frame-1 {
                width: 550px;
                height: 383px;
            }
            
            .frame-2 {
                width: 600px;
                height: 433px;
            }
            
            .glowing-text {
                font-size: 60px;
            }
            
            .glowing-text-subtitle {
                font-size: 20px;
            }
        }

        @media (max-width: 1024px) {
            .titles-container {
                display: none;
            }

            .title-toggle-btn {
                display: none;
            }

            .side-nav-buttons {
                left: 20px;
            }

            .side-nav-buttons.rtl {
                right: 20px;
            }
            
            .logo-image-mask {
                width: 450px;
                height: 300px;
            }
            
            .frame-1 {
                width: 500px;
                height: 350px;
            }
            
            .frame-2 {
                width: 550px;
                height: 400px;
            }
            
            .glowing-text {
                font-size: 50px;
            }
            
            .glowing-text-subtitle {
                font-size: 18px;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 12px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                display: none;
            }

            .slider {
                width: 96%;
                height: 78vh;
            }

            .slide-content-container {
                padding: 15px;
            }

            .section {
                padding: 12px;
            }

            .main-title {
                font-size: 18px;
            }

            .arabic-title {
                font-size: 14px;
            }

            .feature-list,
            .content-columns {
                grid-template-columns: 1fr;
            }

            .slide-footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
                padding: 12px 20px;
            }

            .side-nav-buttons {
                display: none;
            }
            
            .logo-image-mask {
                width: 350px;
                height: 233px;
            }
            
            .frame-1 {
                width: 400px;
                height: 283px;
            }
            
            .frame-2 {
                width: 450px;
                height: 333px;
            }
            
            .glowing-text {
                font-size: 40px;
            }
            
            .glowing-text-subtitle {
                font-size: 16px;
                top: calc(50% + 40px);
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 16px;
            }

            .arabic-title {
                font-size: 13px;
            }

            .section {
                padding: 10px;
            }

            .slide-cta {
                flex-direction: column;
                width: 100%;
            }

            .slide-cta button {
                width: 100%;
            }
            
            .logo-image-mask {
                width: 280px;
                height: 187px;
            }
            
            .frame-1 {
                width: 330px;
                height: 237px;
            }
            
            .frame-2 {
                width: 380px;
                height: 287px;
            }
            
            .glowing-text {
                font-size: 32px;
            }
            
            .glowing-text-subtitle {
                font-size: 14px;
                top: calc(50% + 35px);
            }
        }

        /* Scrollbar Styling */
        .slide-content-container::-webkit-scrollbar {
            width: 4px;
        }

        .slide-content-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 2px;
        }

        .slide-content-container::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--gold-color), var(--secondary-gold));
            border-radius: 2px;
        }

        .slide-content-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(var(--secondary-gold), var(--gold-color));
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">الأكاديمية الدولية للإبداع</div>
        <div class="loading-progress">
            <div class="loading-progress-bar" id="loadingProgress"></div>
        </div>
    </div>
    
    <!-- حاوية أنيميشن الصورة -->
    <div class="logo-animation-container" id="logoAnimation">
        <div class="animation-gradient-bg"></div>
        <div class="light-beam"></div>
        <div class="animation-lines" id="animationLines"></div>
        <div class="animation-particles" id="animationParticles"></div>
        
        <div class="glowing-text" id="glowingText">ICA</div>
        <div class="glowing-text-subtitle" id="glowingSubtitle">International Creative Academy</div>
        
        <div class="golden-frame frame-1"></div>
        <div class="golden-frame frame-2"></div>
        
        <div class="logo-image-mask">
            <!-- سيتم إضافة الصورة ديناميكياً عبر JavaScript -->
            <svg class="logo-mask" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <mask id="imageMask">
                        <rect width="600" height="400" fill="white"/>
                        <circle id="maskCircle" cx="300" cy="200" r="0" fill="black"/>
                    </mask>
                </defs>
                <rect width="600" height="400" mask="url(#imageMask)" fill="white"/>
            </svg>
        </div>
    </div>

    <!-- Side Navigation Buttons -->
    <div class="side-nav-buttons rtl" id="sideNavButtons">
        <button class="side-nav-btn" id="prevBtn">
            <i class="fas fa-chevron-right"></i>
            <span class="nav-label">السابق</span>
        </button>
        <button class="side-nav-btn" id="nextBtn">
            <i class="fas fa-chevron-left"></i>
            <span class="nav-label">التالي</span>
        </button>
    </div>

    <!-- Titles Navigation -->
    <div class="titles-container rtl" id="titlesContainer"></div>
    <button class="title-toggle-btn rtl" id="titleToggleBtn">
        <i class="fas fa-list"></i>
    </button>

    <!-- Parallax Background -->
    <div class="parallax-bg"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Navigation -->
    <nav id="mainNav">
        <div class="logo">
            ICA
            <span>من التعلم إلى الاحتراف</span>
        </div>
        <div class="nav-links">
            <a href="#" data-index="0">نبذة</a>
            <a href="#" data-index="1">رؤية</a>
            <a href="#" data-index="2">تكنولوجيا</a>
            <a href="#" data-index="3">مسار</a>
            <a href="#" data-index="4">اتصال</a>
        </div>
        <div class="cta">
            <button id="navRegisterBtn">سجل الآن</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        <div class="slider-container">
            <div class="slider" id="slider">
                <!-- Slides will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="mainFooter">
        <div class="footer-left">© 2024 الأكاديمية الدولية للإبداع</div>
        <div class="footer-right">
            <div class="scroll-hint" id="scrollHint">
                <span>تمرير للاستكشاف</span>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </footer>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        // ===== ANIMATION FUNCTIONS =====
        
        // دالة إنشاء أنيميشن الصورة
        function createLogoAnimation() {
            const logoAnimation = document.getElementById('logoAnimation');
            const animationLines = document.getElementById('animationLines');
            const animationParticles = document.getElementById('animationParticles');
            const logoImageMask = document.querySelector('.logo-image-mask');
            
            // إضافة الصورة ديناميكياً
            const img = document.createElement('img');
            // img.src = 'img/logo.jpeg';
            // img.alt = 'International Creative Academy Logo';
            // img.className = 'logo-image';
            // img.id = 'logoImage';
            
            // إدراج الصورة في البداية
            logoImageMask.insertBefore(img, logoImageMask.firstChild);
            
            // إنشاء الخطوط المتحركة
            for (let i = 0; i < 12; i++) {
                const line = document.createElement('div');
                line.className = 'line';
                
                const angle = (i / 12) * Math.PI * 2;
                const length = 800 + Math.random() * 400;
                const width = 2 + Math.random() * 3;
                const x = Math.cos(angle) * 100;
                const y = Math.sin(angle) * 100;
                
                line.style.width = `${length}px`;
                line.style.height = `${width}px`;
                line.style.left = `calc(50% + ${x}px)`;
                line.style.top = `calc(50% + ${y}px)`;
                line.style.transform = `rotate(${angle}rad)`;
                line.style.background = `linear-gradient(90deg, transparent, var(--gold-color), transparent)`;
                
                animationLines.appendChild(line);
            }
            
            // إنشاء الجزيئات المتحركة
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = 2 + Math.random() * 5;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.background = `radial-gradient(circle, var(--gold-color), var(--secondary-gold))`;
                particle.style.boxShadow = `0 0 ${size * 2}px var(--gold-color)`;
                
                animationParticles.appendChild(particle);
            }
            
            return logoAnimation;
        }
        
        // دالة الأنيميشن الرئيسية
        function playLogoAnimation() {
            const tl = gsap.timeline({
                defaults: {
                    ease: "power3.out"
                }
            });
            
            // بداية الأنيميشن - إظهار الخلفية
            tl.set('.logo-animation-container', { opacity: 1 })
              .fromTo('.animation-gradient-bg',
                { opacity: 0, scale: 0.5 },
                { opacity: 0.3, scale: 1, duration: 1.5, ease: "power2.inOut" },
                0
              )
              
              // إظهار حزم الضوء
              .fromTo('.light-beam',
                { opacity: 0, scale: 0 },
                { opacity: 0.4, scale: 1, duration: 1.2, ease: "back.out(1.7)" },
                0.2
              )
              
              // أنيميشن الماسك الدائري
              .to('#maskCircle',
                { attr: { r: 250 }, duration: 1.8, ease: "power2.inOut" },
                0.5
              )
              
              // إظهار الخطوط المتحركة
              .to('.line',
                {
                    opacity: 0.6,
                    duration: 1,
                    stagger: {

        // دالة أنيميشن التحميل
        function loadingAnimation() {
            const tl = gsap.timeline();
            const loadingProgress = document.getElementById('loadingProgress');
            
            // محاكاة تقدم التحميل
            tl.to(loadingProgress,
                {
                    width: "100%",
                    duration: 2.5,
                    ease: "power2.inOut",
                    onUpdate: function() {
                        const progress = Math.round(this.progress() * 100);
                        loadingProgress.style.width = `${progress}%`;
                    }
                },
                0
            )
            
            // إخفاء شاشة التحميل
            .to('#loadingScreen',
                {
                    opacity: 0,
                    duration: 0.8,
                    ease: "power2.inOut",
                    onComplete: () => {
                        document.getElementById('loadingScreen').classList.add('fade-out');
                        setTimeout(() => {
                            document.getElementById('loadingScreen').style.display = 'none';
                            startMainAnimation();
                        }, 800);
                    }
                },
                2.5
            );
            
            return tl;
        }
        
        // دالة أنيميشن عناوين التنقل
        function animateTitlesNavigation() {
            const tl = gsap.timeline();
            const titleItems = document.querySelectorAll('.title-item');
            const titleConnectors = document.querySelectorAll('.title-connector');
            
            // إظهار الحاوية
            tl.to('#titlesContainer',
                {
                    opacity: 1,
                    duration: 0.8,
                    ease: "power2.out",
                    onComplete: () => {
                        document.getElementById('titlesContainer').classList.add('visible');
                    }
                },
                0
            )
            
            // أنيميشن دخول العناصر بالتسلسل
            .to(titleItems,
                {
                    opacity: 0.6,
                    x: 0,
                    duration: 0.6,
                    stagger: {
                        amount: 0.8,
                        from: "start",
                        ease: "back.out(1.2)"
                    },
                    ease: "back.out(1.2)"
                },
                0.2
            )
            
            // إضافة تأثير اهتزاز خفيف للعناصر
            .to(titleItems,
                {
                    y: () => Math.random() * 10 - 5,
                    duration: 0.3,
                    stagger: {
                        amount: 0.5,
                        from: "random"
                    },
                    repeat: 1,
                    yoyo: true,
                    ease: "sine.inOut"
                },
                0.8
            )
            
            // إظهار الموصلات بين العناصر
            .to(titleConnectors,
                {
                    opacity: 0.3,
                    duration: 0.4,
                    stagger: 0.1,
                    ease: "power2.out"
                },
                1
            );
            
            return tl;
        }
        
        // دالة أنيميشن زر التبديل
        function animateTitleToggleButton() {
            const tl = gsap.timeline();
            
            // إظهار زر التبديل
            tl.to('#titleToggleBtn',
                {
                    opacity: 1,
                    duration: 0.6,
                    ease: "power2.out",
                    onComplete: () => {
                        document.getElementById('titleToggleBtn').classList.add('visible');
                    }
                },
                0
            )
            
            // تأثير دوران خفيف
            .to('#titleToggleBtn i',
                {
                    rotation: 360,
                    duration: 1,
                    ease: "power2.out"
                },
                0.2
            )
            
            // تأثير تموج
            .to('#titleToggleBtn',
                {
                    scale: 1.1,
                    duration: 0.3,
                    yoyo: true,
                    repeat: 1,
                    ease: "power1.inOut"
                },
                0.5
            );
            
            return tl;
        }
