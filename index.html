        // Initialize Application
        class AcademySlider {
            constructor() {
                this.currentSlide = 0;
                this.isAnimating = false;
                this.totalSlides = slidesData.length;
                this.slider = document.getElementById('slider');
                this.progressBar = document.getElementById('progressBar');
                this.loadingScreen = document.getElementById('loadingScreen');
                this.titlesContainer = document.getElementById('titlesContainer');
                this.titleToggleBtn = document.getElementById('titleToggleBtn');
                this.sideNavButtons = document.getElementById('sideNavButtons');
                this.prevBtn = document.getElementById('prevBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.isTitlesVisible = true;

                this.init();
            }

            init() {
                this.createParticles();
                this.initSlider();
                this.createTitlesNavigation();
                this.setupEventListeners();
                this.updateNavigationButtons();

                // Initialize animations
                gsap.registerPlugin(ScrollTrigger);
            }

            createParticles() {
                const particlesContainer = document.getElementById('particles');
                const particleCount = 30;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');

                    const size = Math.random() * 3 + 1;
                    const posX = Math.random() * 100;
                    const posY = Math.random() * 100;
                    const duration = Math.random() * 10 + 10;
                    const delay = Math.random() * 5;

                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${posX}%`;
                    particle.style.top = `${posY}%`;
                    particle.style.opacity = Math.random() * 0.2;

                    gsap.to(particle, {
                        x: () => Math.random() * 100 - 50,
                        y: () => Math.random() * 100 - 50,
                        duration: duration,
                        delay: delay,
                        repeat: -1,
                        yoyo: true,
                        ease: "sine.inOut"
                    });

                    particlesContainer.appendChild(particle);
                }
            }

            initSlider() {
                this.slider.innerHTML = '';

                slidesData.forEach((data, index) => {
                    this.createSlide(data, index);
                });

                this.updateSlidesPosition();
                this.updateProgress();
            }

            createSlide(data, index) {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.dataset.index = index;
                slide.dataset.id = data.id;

                slide.innerHTML = `
                    <div class="slide-bg" style="background: ${data.bgGradient}"></div>
                    
                    <div class="slide-content-container" data-slide="${data.id}">
                        ${data.sections.map((section, sectionIndex) => {
                            if (section.type === 'title') {
                                return `
                                    <div class="section title-section" data-section="${sectionIndex}">
                                        <div class="section-content">
                                            ${section.content}
                                        </div>
                                    </div>
                                `;
                            } else if (section.type === 'highlight') {
                                return `
                                    <div class="section highlight-section" data-section="${sectionIndex}">
                                        <div class="section-header">
                                            <div class="section-icon">
                                                <i class="${section.icon}"></i>
                                            </div>
                                            <div class="section-title">${section.title}</div>
                                        </div>
                                        <div class="section-content">
                                            ${section.content}
                                        </div>
                                    </div>
                                `;
                            } else {
                                return `
                                    <div class="section" data-section="${sectionIndex}">
                                        <div class="section-header">
                                            <div class="section-icon">
                                                <i class="${section.icon}"></i>
                                            </div>
                                            <div class="section-title">${section.title}</div>
                                        </div>
                                        <div class="section-content">
                                            ${section.content}
                                        </div>
                                    </div>
                                `;
                            }
                        }).join('')}
                    </div>
                    
                    <div class="slide-footer">
                        <div class="slide-indicator">
                            <span>${data.number}/${this.totalSlides}</span>
                            <div class="indicator-dots">
                                ${slidesData.map((_, i) => `
                                    <div class="indicator-dot ${i === index ? 'active' : ''}"></div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="slide-cta">
                            ${index === 4 ? `
                                <button class="primary submit-form-btn" data-slide="${data.id}">
                                    <i class="fas fa-paper-plane" style="margin-left: 5px;"></i>
                                    إرسال الطلب
                                </button>
                            ` : `
                                <button class="info-btn" data-index="${index}">
                                    <i class="fas fa-info-circle" style="margin-left: 5px;"></i>
                                    معلومات
                                </button>
                                <button class="primary register-btn" data-index="${index}">
                                    <i class="fas fa-user-plus" style="margin-left: 5px;"></i>
                                    سجل الآن
                                </button>
                            `}
                        </div>
                    </div>
                `;

                this.slider.appendChild(slide);
                return slide;
            }

            createTitlesNavigation() {
                this.titlesContainer.innerHTML = '';
                
                slidesData.forEach((slide, index) => {
                    const titleItem = document.createElement('div');
                    titleItem.className = `title-item ${index === 0 ? 'active' : ''}`;
                    titleItem.dataset.index = index;
                    
                    titleItem.innerHTML = `
                        <span class="title-number">${slide.number}</span>
                        <span class="title-text">${slide.arabicTitle}</span>
                    `;
                    
                    // Add click event
                    titleItem.addEventListener('click', () => {
                        this.animateTitleItemClick(index);
                        this.goToSlide(index);
                    });
                    
                    this.titlesContainer.appendChild(titleItem);
                    
                    // Add connector except for last item
                    if (index < slidesData.length - 1) {
                        const connector = document.createElement('div');
                        connector.className = 'title-connector';
                        this.titlesContainer.appendChild(connector);
                    }
                });
            }

            // دالة أنيميشن النقر على عنصر العنوان
            animateTitleItemClick(index) {
                const titleItem = document.querySelector(`.title-item[data-index="${index}"]`);
                if (!titleItem) return;

                // تأثير اهتزاز عند النقر
                gsap.to(titleItem, {
                    scale: 0.95,
                    duration: 0.1,
                    yoyo: true,
                    repeat: 1,
                    ease: "power1.inOut"
                });

                // تأثير وميض للرقم
                const titleNumber = titleItem.querySelector('.title-number');
                gsap.to(titleNumber, {
                    color: '#ffffff',
                    duration: 0.2,
                    yoyo: true,
                    repeat: 1,
                    ease: "power1.inOut"
                });
            }

            updateTitlesNavigation() {
                const titleItems = document.querySelectorAll('.title-item');
                const titleConnectors = document.querySelectorAll('.title-connector');
                
                titleItems.forEach((item, index) => {
                    if (index === this.currentSlide) {
                        item.classList.add('active');
                        
                        // أنيميشن العنصر النشط
                        gsap.fromTo(item,
                            {
                                scale: 0.9,
                                x: 10,
                                boxShadow: '0 5px 15px rgba(212, 175, 55, 0.2)'
                            },
                            {
                                scale: 1,
                                x: 0,
                                boxShadow: '0 5px 25px rgba(212, 175, 55, 0.4)',
                                duration: 0.6,
                                ease: "elastic.out(1, 0.5)"
                            }
                        );
                        
                        // أنيميشن الرقم
                        const titleNumber = item.querySelector('.title-number');
                        gsap.fromTo(titleNumber,
                            {
                                scale: 1,
                                color: '#d4af37'
                            },
                            {
                                scale: 1.2,
                                color: '#ffffff',
                                duration: 0.4,
                                ease: "back.out(1.2)",
                                onComplete: () => {
                                    gsap.to(titleNumber, {
                                        scale: 1.2,
                                        duration: 0.3,
                                        ease: "power1.out"
                                    });
                                }
                            }
                        );
                        
                        // إظهار الموصلات
                        if (index > 0) {
                            gsap.to(titleConnectors[index - 1], {
                                opacity: 0.5,
                                duration: 0.4,
                                ease: "power2.out"
                            });
                        }
                    } else {
                        item.classList.remove('active');
                        
                        // إخفاء الموصلات للعناصر غير النشطة
                        if (index > 0) {
                            gsap.to(titleConnectors[index - 1], {
                                opacity: 0.3,
                                duration: 0.4,
                                ease: "power2.out"
                            });
                        }
                    }
                });
            }

            updateNavigationButtons() {
                // Update previous button
                if (this.currentSlide === 0) {
                    this.prevBtn.classList.add('disabled');
                    this.prevBtn.style.cursor = 'not-allowed';
                } else {
                    this.prevBtn.classList.remove('disabled');
                    this.prevBtn.style.cursor = 'pointer';
                }

                // Update next button
                if (this.currentSlide === this.totalSlides - 1) {
                    this.nextBtn.classList.add('disabled');
                    this.nextBtn.style.cursor = 'not-allowed';
                } else {
                    this.nextBtn.classList.remove('disabled');
                    this.nextBtn.style.cursor = 'pointer';
                }

                // Animate button hover effect
                if (!this.prevBtn.classList.contains('disabled')) {
                    gsap.to(this.prevBtn, {
                        scale: 1,
                        duration: 0.3,
                        ease: "back.out(1.2)"
                    });
                }

                if (!this.nextBtn.classList.contains('disabled')) {
                    gsap.to(this.nextBtn, {
                        scale: 1,
                        duration: 0.3,
                        ease: "back.out(1.2)"
                    });
                }
            }

            toggleTitlesNavigation() {
                this.isTitlesVisible = !this.isTitlesVisible;
                
                if (this.isTitlesVisible) {
                    this.titlesContainer.classList.remove('hidden');
                    this.titlesContainer.classList.add('visible');
                    this.titleToggleBtn.innerHTML = '<i class="fas fa-list"></i>';
                    
                    // Animate in
                    gsap.fromTo(this.titlesContainer,
                        {
                            opacity: 0,
                            x: 20
                        },
                        {
                            opacity: 1,
                            x: 0,
                            duration: 0.6,
                            ease: "power2.out"
                        }
                    );
                    
                    // أنيميشن زر التبديل
                    gsap.to(this.titleToggleBtn, {
                        rotation: 180,
                        duration: 0.4,
                        ease: "back.out(1.2)"
                    });
                } else {
                    this.titlesContainer.classList.remove('visible');
                    this.titlesContainer.classList.add('hidden');
                    this.titleToggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
                    
                    // أنيميشن زر التبديل
                    gsap.to(this.titleToggleBtn, {
                        rotation: 0,
                        duration: 0.4,
                        ease: "back.out(1.2)"
                    });
                }
            }

            animateInSlide(slideIndex) {
                const slide = document.querySelector(`.slide[data-index="${slideIndex}"]`);
                if (!slide) return;

                slide.classList.add('active');

                const sections = slide.querySelectorAll('.section');
                sections.forEach((section, i) => {
                    gsap.fromTo(section,
                        {
                            opacity: 0,
                            y: 20,
                            scale: 0.95,
                            rotationY: -10
                        },
                        {
                            opacity: 1,
                            y: 0,
                            scale: 1,
                            rotationY: 0,
                            duration: 0.6,
                            delay: i * 0.1,
                            ease: "back.out(1.2)"
                        }
                    );
                });
            }

            animateOutSlide(slideIndex) {
                const slide = document.querySelector(`.slide[data-index="${slideIndex}"]`);
                if (!slide) return;

                slide.classList.remove('active');

                const sections = slide.querySelectorAll('.section');
                sections.forEach((section, i) => {
                    gsap.to(section, {
                        opacity: 0,
                        y: -20,
                        scale: 0.95,
                        rotationY: 10,
                        duration: 0.4,
                        delay: (sections.length - i - 1) * 0.05,
                        ease: "power2.in"
                    });
                });
            }

            updateSlidesPosition() {
                const slides = Array.from(this.slider.querySelectorAll('.slide'));

                slides.forEach((slide, index) => {
                    const slideIndex = parseInt(slide.dataset.index);
                    const distance = Math.abs(slideIndex - this.currentSlide);

                    let z = -distance * 800;
                    let scale = 1 - (distance * 0.2);
                    let opacity = distance === 0 ? 1 : 0.3 - (distance * 0.15);
                    let filter = `brightness(${1 - (distance * 0.4)})`;

                    if (slideIndex < this.currentSlide) {
                        z -= 200;
                        opacity *= 0.5;
                    }

                    gsap.to(slide, {
                        duration: 1.2,
                        z: z,
                        scale: scale,
                        opacity: opacity,
                        filter: filter,
                        rotationY: (slideIndex - this.currentSlide) * 10,
                        ease: "power3.inOut",
                        overwrite: true,
                        onComplete: () => {
                            if (slideIndex === this.currentSlide) {
                                this.animateInSlide(slideIndex);
                            }
                        }
                    });
                });
            }

            setupEventListeners() {
                // Previous button
                this.prevBtn.addEventListener('click', (e) => {
                    if (this.isAnimating || this.currentSlide === 0) return;
                    this.goToSlide(this.currentSlide - 1);
                    
                    // Button animation
                    gsap.to(e.target.closest('.side-nav-btn'), {
                        scale: 0.9,
                        duration: 0.1,
                        yoyo: true,
                        repeat: 1
                    });
                });

                // Next button
                this.nextBtn.addEventListener('click', (e) => {
                    if (this.isAnimating || this.currentSlide === this.totalSlides - 1) return;
                    this.goToSlide(this.currentSlide + 1);
                    
                    // Button animation
                    gsap.to(e.target.closest('.side-nav-btn'), {
                        scale: 0.9,
                        duration: 0.1,
                        yoyo: true,
                        repeat: 1
                    });
                });

                // Wheel navigation
                let wheelTimeout;
                window.addEventListener('wheel', (e) => {
                    const isContentScroll = e.target.closest('.slide-content-container');
                    if (isContentScroll) return;

                    clearTimeout(wheelTimeout);
                    wheelTimeout = setTimeout(() => {
                        if (e.deltaY > 0) {
                            this.goToSlide(this.currentSlide + 1);
                        } else {
                            this.goToSlide(this.currentSlide - 1);
                        }
                    }, 100);
                }, { passive: false });

                // Touch navigation
                let touchStartY = 0;
                window.addEventListener('touchstart', (e) => {
                    const isContentTouch = e.target.closest('.slide-content-container');
                    if (isContentTouch) return;
                    touchStartY = e.touches[0].clientY;
                });

                window.addEventListener('touchend', (e) => {
                    const isContentTouch = e.target.closest('.slide-content-container');
                    if (isContentTouch) return;

                    const touchEndY = e.changedTouches[0].clientY;
                    const deltaY = touchStartY - touchEndY;

                    if (Math.abs(deltaY) > 40) {
                        if (deltaY > 0) {
                            this.goToSlide(this.currentSlide + 1);
                        } else {
                            this.goToSlide(this.currentSlide - 1);
                        }
                    }
                });

                // Navigation links
                document.querySelectorAll('.nav-links a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const index = parseInt(link.dataset.index);
                        this.goToSlide(index);
                    });
                });

                // Titles toggle button
                this.titleToggleBtn.addEventListener('click', () => {
                    this.toggleTitlesNavigation();
                });

                // Buttons
                document.getElementById('navRegisterBtn').addEventListener('click', () => {
                    this.goToSlide(4);
                });

                document.getElementById('scrollHint').addEventListener('click', () => {
                    this.goToSlide(this.currentSlide + 1);
                });

                document.addEventListener('click', (e) => {
                    // Register button
                    if (e.target.closest('.register-btn')) {
                        e.preventDefault();
                        this.goToSlide(4);
                    }

                    // Info button
                    if (e.target.closest('.info-btn')) {
                        e.preventDefault();
                        const slide = document.querySelector(`.slide[data-index="${this.currentSlide}"]`);
                        if (slide) {
                            const container = slide.querySelector('.slide-content-container');
                            gsap.to(container, {
                                scrollTop: 0,
                                duration: 0.8,
                                ease: "power2.inOut"
                            });
                        }
                    }

                    // Submit form button
                    if (e.target.closest('.submit-form-btn')) {
                        e.preventDefault();
                        this.submitRegistrationForm();
                    }
                });

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    const isFormField = e.target.matches('input, select, textarea');
                    if (isFormField) return;

                    switch (e.key) {
                        case 'ArrowLeft':
                            this.goToSlide(this.currentSlide - 1);
                            e.preventDefault();
                            break;
                        case 'ArrowRight':
                            this.goToSlide(this.currentSlide + 1);
                            e.preventDefault();
                            break;
                        case 'ArrowDown':
                        case ' ':
                        case 'PageDown':
                            this.goToSlide(this.currentSlide + 1);
                            e.preventDefault();
                            break;
                        case 'ArrowUp':
                        case 'PageUp':
                            this.goToSlide(this.currentSlide - 1);
                            e.preventDefault();
                            break;
                        case 'Home':
                            this.goToSlide(0);
                            e.preventDefault();
                            break;
                        case 'End':
                            this.goToSlide(this.totalSlides - 1);
                            e.preventDefault();
                            break;
                        case 't':
                        case 'T':
                            // Toggle titles with T key
                            this.toggleTitlesNavigation();
                            e.preventDefault();
                            break;
                    }
                });

                // Parallax effect
                window.addEventListener('mousemove', (e) => {
                    const x = (e.clientX / window.innerWidth) * 20 - 10;
                    const y = (e.clientY / window.innerHeight) * 20 - 10;

                    gsap.to('.parallax-bg', {
                        x: x,
                        y: y,
                        duration: 1,
                        ease: "power2.out"
                    });
                });
            }

            goToSlide(index) {
                if (this.isAnimating) return;

                index = Math.max(0, Math.min(index, this.totalSlides - 1));

                if (index === this.currentSlide) return;

                this.isAnimating = true;
                const prevSlide = this.currentSlide;
                this.currentSlide = index;

                // Animate out previous slide
                this.animateOutSlide(prevSlide);

                // Update UI
                this.updateSlidesPosition();
                this.updateProgress();
                this.updateIndicators();
                this.updateTitlesNavigation();
                this.updateNavigationButtons();

                // Reset animation flag
                setTimeout(() => {
                    this.isAnimating = false;
                }, 1200);
            }

            updateProgress() {
                const progress = (this.currentSlide / (this.totalSlides - 1)) * 100;
                gsap.to(this.progressBar, {
                    width: `${progress}%`,
                    duration: 0.8,
                    ease: "power2.out"
                });
            }

            updateIndicators() {
                const dots = document.querySelectorAll('.indicator-dot');
                dots.forEach((dot, index) => {
                    if (index === this.currentSlide) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });

                // Update navigation
                document.querySelectorAll('.nav-links a').forEach(link => {
                    const index = parseInt(link.dataset.index);
                    if (index === this.currentSlide) {
                        link.style.background = 'rgba(212, 175, 55, 0.2)';
                        link.style.color = 'var(--gold-color)';
                    } else {
                        link.style.background = '';
                        link.style.color = 'rgba(255, 255, 255, 0.7)';
                    }
                });
            }

            submitRegistrationForm() {
                const currentSlideElement = document.querySelector(`.slide[data-index="${this.currentSlide}"]`);
                if (!currentSlideElement) return;

                const inputs = currentSlideElement.querySelectorAll('input, select, textarea');
                let isValid = true;
                let formData = {};

                inputs.forEach(input => {
                    if (input.hasAttribute('required') && !input.value.trim()) {
                        isValid = false;
                        gsap.to(input, {
                            borderColor: '#ff4757',
                            duration: 0.3,
                            yoyo: true,
                            repeat: 1,
                            onComplete: () => {
                                gsap.to(input, {
                                    borderColor: 'rgba(255, 255, 255, 0.1)',
                                    duration: 0.3
                                });
                            }
                        });
                    } else {
                        formData[input.name || input.placeholder] = input.value;
                    }
                });

                if (!isValid) {
                    // Show error animation
                    const submitBtn = currentSlideElement.querySelector('.submit-form-btn');
                    gsap.to(submitBtn, {
                        x: 10,
                        duration: 0.1,
                        yoyo: true,
                        repeat: 5,
                        ease: "power1.inOut",
                        onComplete: () => {
                            gsap.to(submitBtn, {
                                x: 0,
                                duration: 0.2
                            });
                        }
                    });

                    return;
                }

                // Success animation
                const submitBtn = currentSlideElement.querySelector('.submit-form-btn');
                if (submitBtn) {
                    gsap.to(submitBtn, {
                        scale: 0.9,
                        duration: 0.1,
                        yoyo: true,
                        repeat: 1,
                        onComplete: () => {
                            // Show success message
                            const successMsg = document.createElement('div');
                            successMsg.innerHTML = `
                                <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                                         background: rgba(10, 10, 10, 0.95); padding: 30px; border-radius: 12px; 
                                         border: 1px solid var(--gold-color); z-index: 9999; text-align: center; 
                                         max-width: 400px; backdrop-filter: blur(10px);">
                                    <i class="fas fa-check-circle" style="font-size: 48px; color: var(--gold-color); margin-bottom: 20px;"></i>
                                    <h3 style="color: var(--gold-color); margin-bottom: 10px;">تم إرسال طلب التسجيل بنجاح!</h3>
                                    <p style="color: rgba(255,255,255,0.8); margin-bottom: 20px;">سيتم التواصل معك خلال 48 ساعة.</p>
                                    <button onclick="this.parentElement.remove()" style="
                                        background: var(--gold-color); color: var(--bg-color); border: none; 
                                        padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;">
                                        موافق
                                    </button>
                                </div>
                            `;
                            document.body.appendChild(successMsg);

                            // Reset form
                            inputs.forEach(input => {
                                if (input.type !== 'submit') {
                                    input.value = '';
                                }
                            });
                        }
                    });
                }
            }
        }

        // تهيئة التطبيق الرئيسي
        function initializeMainApplication() {
            const academySlider = new AcademySlider();

            // Make it globally accessible for debugging
            window.academySlider = academySlider;

            console.log('%c🎨 الأكاديمية الدولية للإبداع 🎨', 'color: #d4af37; font-size: 18px; font-weight: bold;');
            console.log('%c✨ تم تحميل أنيميشن الصورة والتطبيق بنجاح ✨', 'color: #b8860b; font-size: 12px;');
        }

        // بدء التحميل عند تحميل الصفحة
        window.addEventListener('load', () => {
            // بدء أنيميشن التحميل
            loadingAnimation();
        });
    </script>
</body>
